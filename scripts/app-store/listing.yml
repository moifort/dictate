    Μια μικρή κάψουλα στο κάτω μέρος της οθόνης δείχνει ότι το Dictate ακούει, μετά δουλεύει και ύστερα σβήνει.

    Απαιτεί Mac με Apple silicon. Δωρεάν και ανοιχτού κώδικα, από την Polyforms.
