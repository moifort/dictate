name: Dictate
options:
  bundleIdPrefix: com.thibautmottet
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: 46C337T7YN
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    # Overridden by the release workflow from the tag and the commit count.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 1.1.1
targets:
  Dictate:
    type: application
    platform: macOS
    sources:
      - Dictate
    dependencies:
      - package: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thibautmottet.dictate
        PRODUCT_NAME: Dictate
        INFOPLIST_FILE: Dictate/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Dictate/Resources/Dictate.entitlements
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DictateTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DictateTests
    dependencies:
      - target: Dictate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thibautmottet.dictate.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dictate.app/Contents/MacOS/Dictate"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Dictate:
    build:
      targets:
        Dictate: all
        DictateTests: [test]
    test:
      targets:
        - DictateTests
