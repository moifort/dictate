name: Dictate
options:
  bundleIdPrefix: com.thibautmottet
  organizationName: Polyforms
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  # The strings in the code are French; English is a translation in the
  # String Catalogs (Dictate/Resources/*.xcstrings).
  developmentLanguage: fr
  # The project is generated, so the pinned package versions live at the
  # root and are copied in. After updating a package in Xcode, copy the
  # project's Package.resolved back to the root.
  postGenCommand: >-
    mkdir -p Dictate.xcodeproj/project.xcworkspace/xcshareddata/swiftpm &&
    cp Package.resolved Dictate.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
# AppStore is the sandboxed Mac App Store build: scripts/build-app-store.sh.
configs:
  Debug: debug
  Release: release
  AppStore: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: 46C337T7YN
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    # Overridden by the release workflow from the tag and the commit count.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: 0.17.7
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 9.30.1
targets:
  Dictate:
    type: application
    platform: macOS
    sources:
      - Dictate
    dependencies:
      - package: FluidAudio
      - package: Sentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thibautmottet.dictate
        PRODUCT_NAME: Dictate
        INFOPLIST_FILE: Dictate/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Dictate/Resources/Dictate.entitlements
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # macOS ties each privacy grant to the signature it was given to: a dev
      # build sharing the release identifier would silently void the installed
      # app's Accessibility and Input Monitoring grants.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.thibautmottet.dictate.dev
        # Sandboxed, without the updater, the uninstaller and the Claude reviewer
        # (Dictate/App/Distribution.swift). Signed by Xcode at export time.
        # A new app on the store: under the Polyforms identifier from the start.
        AppStore:
          PRODUCT_BUNDLE_IDENTIFIER: com.polyforms.dictate
          CODE_SIGN_ENTITLEMENTS: Dictate/Resources/DictateAppStore.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
  DictateTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DictateTests
    dependencies:
      - target: Dictate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thibautmottet.dictate.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dictate.app/Contents/MacOS/Dictate"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Dictate:
    build:
      targets:
        Dictate: all
        DictateTests: [test]
    test:
      # Some tests read user-facing text: pin it whatever the runner's language.
      language: fr
      region: FR
      targets:
        - DictateTests
