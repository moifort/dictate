name: Tests

# The unit suite on every commit to main and on pull requests. No microphone,
# no Parakeet model, no Claude: the controller runs on fakes and the Parakeet
# integration test skips itself when the model is not on disk.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🎙️ Unit tests
    # The app targets macOS 27, so the test host only launches on a macOS 27
    # runner. `xcode-27` is GitHub's macOS 27 + Xcode 27 image.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 27
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate

      - name: Restore Swift packages
        uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}

      - name: Run the unit tests
        # No signing identity on a runner: ad-hoc signing is enough to run tests.
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Dictate.xcodeproj -scheme Dictate \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
