name: Release

# One release per tag:
#
#   git tag -a v0.2.0 -m "What changes in this version…"
#   git push origin v0.2.0
#
# Tests, builds the app, signs it with Developer ID, notarizes it and publishes
# a GitHub release with a disk image (manual installs) and a zip (the in-app
# updater). A manual run stops before publishing and leaves both as run
# artifacts.
#
# The tests and the build run side by side; the release is only published
# once both pass.
#
# This is the Developer ID build. The Mac App Store build is a separate,
# sandboxed configuration without the `claude` reviewer and the updater:
# scripts/build-app-store.sh.
#
# The Homebrew cask (moifort/homebrew-tap) needs nothing from here: its own
# workflow checks the latest release every hour and bumps version and sha256.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # publish the tag's GitHub release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: 🎙️ Unit tests
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 27
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate

      - name: Restore the Debug build
        id: derived-data
        uses: ./.github/actions/derived-data
        with:
          configuration: Debug

      - name: Run the unit tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Dictate.xcodeproj -scheme Dictate \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=

      - name: Save the Debug build
        if: steps.derived-data.outputs.hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            build
            !build/Logs
            !build/Index.noindex
          key: ${{ steps.derived-data.outputs.key }}

  build:
    name: 📦 Build, sign & notarize
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      # Without a Developer ID certificate the app is still published, ad-hoc
      # signed and not notarized: Gatekeeper then asks for a right-click → Open.
      SIGNED: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      # Without a Sentry token the crashes still arrive, with bare addresses
      # instead of function names.
      SYMBOLICATED: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
      APP: build/Build/Products/Release/Dictate.app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the build number depends on it

      - name: Select Xcode 27
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Compute version numbers
        run: |
          set -euo pipefail
          BUILD=$(git rev-list --count HEAD)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            MARKETING="${GITHUB_REF_NAME#v}"
          else
            MARKETING="0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "MARKETING=$MARKETING" >> "$GITHUB_ENV"
          echo "Releasing Dictate $MARKETING ($BUILD)"

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate

      - name: Restore the Release build
        id: derived-data
        uses: ./.github/actions/derived-data
        with:
          configuration: Release

      # Signed by hand after the build rather than by Xcode: no provisioning
      # profile, no team lookup, and the same command for both signing modes.
      - name: Build the app
        run: scripts/ci-build-release.sh

      # A manual run on main seeds the cache too; a tag's cache would be
      # visible to no other run.
      - name: Save the Release build
        if: steps.derived-data.outputs.hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            build
            !build/Logs
            !build/Index.noindex
          key: ${{ steps.derived-data.outputs.key }}

      # Sentry matches the symbols to a crash by the binary's UUID: the dSYM of
      # this very build, before anything is stripped or signed.
      - name: Upload the debug symbols to Sentry
        if: env.SYMBOLICATED == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: polyforms
          SENTRY_PROJECT: dictate-macos
        run: |
          set -euo pipefail
          brew install getsentry/tools/sentry-cli
          sentry-cli debug-files upload --include-sources build/Build/Products/Release

      - name: Import the Developer ID identity
        if: env.SIGNED == 'true'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          # A throwaway keychain: the login keychain is locked on a runner and
          # codesign would wait for a password nobody will type.
          KEYCHAIN="$RUNNER_TEMP/dictate-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$DEVELOPER_ID_P12" | base64 -d > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed 's/["[:space:]]//g')
          rm -f "$CERT"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Sign the app
        run: |
          set -euo pipefail
          if [ "$SIGNED" = "true" ]; then
            IDENTITY="Developer ID Application"
            TIMESTAMP=--timestamp
          else
            echo "::warning::DEVELOPER_ID_P12 is not set: publishing an ad-hoc signed, non-notarized build"
            IDENTITY=-
            TIMESTAMP=
          fi
          # Inside out: the app's signature seals its frameworks, and a
          # framework left with its build-time ad-hoc signature fails notarization.
          for FRAMEWORK in "$APP"/Contents/Frameworks/*.framework; do
            [ -d "$FRAMEWORK" ] || continue
            codesign --force --options runtime $TIMESTAMP --sign "$IDENTITY" "$FRAMEWORK"
          done
          codesign --force --options runtime $TIMESTAMP \
            --entitlements Dictate/Resources/Dictate.entitlements \
            --sign "$IDENTITY" "$APP"
          codesign --verify --strict --deep --verbose=2 "$APP"

      # The disk image is for people installing by hand: open it, drag the app
      # onto the Applications alias. The updater keeps downloading the zip.
      # scripts/build-dmg.sh lays the window out through Finder, which the
      # macOS runners can drive like any logged-in session.
      - name: Build the disk image
        run: |
          set -euo pipefail
          DMG="Dictate-$MARKETING.dmg"
          scripts/build-dmg.sh "$APP" "$DMG"
          if [ "$SIGNED" = "true" ]; then
            codesign --force --timestamp --sign "Developer ID Application" "$DMG"
          fi
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      # One submission covers both: the image's ticket also holds the app's.
      # `notarytool --wait` can exit 0 on a rejected submission: read the status.
      - name: Notarize and staple
        if: env.SIGNED == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          xcrun notarytool submit "$DMG" \
            --key "$KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          STATUS=$(plutil -extract status raw "$RUNNER_TEMP/notary.json")
          if [ "$STATUS" != "Accepted" ]; then
            ID=$(plutil -extract id raw "$RUNNER_TEMP/notary.json")
            xcrun notarytool log "$ID" --key "$KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
            rm -f "$KEY"
            echo "::error::Notarization $STATUS"
            exit 1
          fi
          rm -f "$KEY"
          xcrun stapler staple "$APP"
          xcrun stapler staple "$DMG"
          spctl --assess --type execute --verbose "$APP"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG"

      - name: Package the zip for the updater
        run: |
          set -euo pipefail
          ZIP="Dictate-$MARKETING.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      # The publish job picks the packages up from here.
      - name: Archive the packages as a run artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Dictate
          path: |
            Dictate-*.dmg
            Dictate-*.zip
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: 🚀 Publish the release
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SIGNED: ${{ secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the tag annotation holds the notes

      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          name: Dictate

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MARKETING="${GITHUB_REF_NAME#v}"
          # The notes live with the tag rather than in a CHANGELOG.
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.txt
          if [ ! -s notes.txt ]; then
            git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME" > notes.txt
          fi
          if [ "$SIGNED" != "true" ]; then
            printf '\n> Not notarized: on first launch, right-click Dictate → Open.\n' >> notes.txt
          fi
          echo "---- Notes ----"; cat notes.txt
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Dictate $MARKETING" --notes-file notes.txt
          else
            gh release create "$GITHUB_REF_NAME" --title "Dictate $MARKETING" --notes-file notes.txt
          fi
          gh release upload "$GITHUB_REF_NAME" "Dictate-$MARKETING.dmg" "Dictate-$MARKETING.zip" --clobber

  # The Mac App Store build, from the same tag: sandboxed, signed with the
  # Apple Distribution and Mac Installer Distribution certificates and a Mac
  # App Store profile, uploaded to App Store Connect. Without those secrets the
  # job is skipped and the GitHub release goes out alone. Submitting the
  # uploaded build for review stays a click in App Store Connect.
  app-store:
    name: 🍎 Mac App Store upload
    needs: test
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      ENABLED: ${{ secrets.MAS_DIST_CERT_P12 != '' && secrets.MAS_PROVISION_PROFILE != '' && secrets.ASC_KEY_P8 != '' }}
    steps:
      - name: Skip without the App Store secrets
        if: env.ENABLED != 'true'
        run: echo "::notice::MAS_DIST_CERT_P12, MAS_PROVISION_PROFILE or ASC_KEY_P8 is not set, no App Store upload (docs/app-store.md)"

      - uses: actions/checkout@v7
        if: env.ENABLED == 'true'
        with:
          fetch-depth: 0   # the build number depends on it

      - name: Select Xcode 27
        if: env.ENABLED == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Compute version numbers
        if: env.ENABLED == 'true'
        run: |
          set -euo pipefail
          echo "BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "MARKETING=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "MARKETING=$(git describe --tags --abbrev=0 --match 'v*' | sed 's/^v//')" >> "$GITHUB_ENV"
          fi

      # Both identities in one throwaway keychain: the login keychain is locked
      # on a runner and codesign would wait for a password nobody will type.
      - name: Import the distribution certificates
        if: env.ENABLED == 'true'
        env:
          MAS_DIST_CERT_P12: ${{ secrets.MAS_DIST_CERT_P12 }}
          MAS_DIST_CERT_PASSWORD: ${{ secrets.MAS_DIST_CERT_PASSWORD }}
          MAS_INSTALLER_CERT_P12: ${{ secrets.MAS_INSTALLER_CERT_P12 }}
          MAS_INSTALLER_CERT_PASSWORD: ${{ secrets.MAS_INSTALLER_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/dictate-mas.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          import_p12() {
            local cert="$RUNNER_TEMP/$1.p12"
            printf '%s' "$2" | base64 -d > "$cert"
            security import "$cert" -P "$3" -A -t cert -f pkcs12 -k "$KEYCHAIN"
            rm -f "$cert"
          }
          import_p12 distribution "$MAS_DIST_CERT_P12" "$MAS_DIST_CERT_PASSWORD"
          import_p12 installer "$MAS_INSTALLER_CERT_P12" "$MAS_INSTALLER_CERT_PASSWORD"
          security set-key-partition-list -S apple-tool:,apple:,productbuild: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed 's/["[:space:]]//g')
          security find-identity -v "$KEYCHAIN"

      # Xcode looks a profile up by the UUID in its file name: read it from the
      # profile, so a renewed one only needs the secret replaced.
      - name: Install the Mac App Store provisioning profile
        if: env.ENABLED == 'true'
        env:
          MAS_PROVISION_PROFILE: ${{ secrets.MAS_PROVISION_PROFILE }}
        run: |
          set -euo pipefail
          PROFILE="$RUNNER_TEMP/dictate.provisionprofile"
          printf '%s' "$MAS_PROVISION_PROFILE" | base64 -d > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          for DIR in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                     "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$PROFILE" "$DIR/$UUID.provisionprofile"
          done
          echo "MAS_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Installed profile $NAME ($UUID)"

      - name: Archive and export the App Store package
        if: env.ENABLED == 'true'
        run: |
          set -euo pipefail
          brew install xcodegen
          scripts/build-app-store.sh

      # A manual run proves the archive and the signature without spending a
      # build number on App Store Connect: only a tag uploads.
      - name: Upload to App Store Connect
        if: env.ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app --type macos \
            --file build/app-store/Dictate.pkg \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "::notice::Dictate $MARKETING ($BUILD) uploaded to App Store Connect"
